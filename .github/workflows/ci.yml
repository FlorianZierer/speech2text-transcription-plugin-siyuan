name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 生产构建：验证 TypeScript 能编译、产物能打包
      - name: Build
        run: npm run build

      # 校验 package.zip 已生成且包含市场必需文件
      - name: Verify package.zip
        run: |
          test -f package.zip || { echo "package.zip not generated"; exit 1; }
          for f in index.js index.css plugin.json icon.png preview.png i18n/zh_CN.json i18n/en_US.json; do
            unzip -l package.zip | grep -q "$f" || { echo "missing $f in package.zip"; exit 1; }
          done
          echo "package.zip OK"
